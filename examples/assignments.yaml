# Maps Authentik (or other IdP) SCIM groups to Kaneo workspaces + roles.
#
# - One group may appear in multiple rows to grant several workspaces at once.
# - Highest role wins when a user is in multiple groups for the same workspace.
# - Allowed roles: viewer, member, admin (owner is never assigned by SCIM).
assignments:
  # Single Authentik group → multiple Kaneo workspaces
  - group: admins
    workspace: product
    role: admin
  - group: admins
    workspace: platform
    role: member

  - group: kaneo-product-member
    workspace: product
    role: member
  - group: kaneo-product-viewer
    workspace: product
    role: viewer
